# Stellar v2 站点配置。
#
# 字段结构以主题 2.0.0 的 _config.yml 为准；这里只覆盖本站需要改动的项，
# 其余使用主题默认值。字段迁移对照见：
# https://xaoxuu.com/wiki/stellar/migration/fields/

######## 布局 ########

leftbar:
  # 站点级 Brand：v1 的 logo.avatar/title/subtitle 拆分为结构化字段。
  brand:
    image:
      src: '{config.avatar}'
      variant: avatar
    name: '{config.title}'
    tagline: '{config.subtitle}'
    href: /
    ghuser: sy0u1ti
  # v1 menubar.columns: 2
  menu_columns: 2
  # v1 menubar.items：theme 配色字段改为 accent。
  menu:
    # 首页即博客列表，沿用主题约定的 post id 以匹配 active_menu。
    - id: post
      title: 首页
      icon: solar:home-bold-duotone
      url: /
      accent: '#3B82F6'
    - id: archives
      title: 归档
      icon: solar:archive-bold-duotone
      url: /archives/
      accent: '#10B981'
    - id: categories
      title: 分类
      icon: solar:folder-bold-duotone
      url: /categories/
      accent: '#F59E0B'
    - id: tags
      title: 标签
      icon: solar:hashtag-square-bold
      url: /tags/
      accent: '#EC4899'
    - id: bangumis
      title: 番剧
      icon: solar:clapperboard-bold-duotone
      url: /bangumis/
      accent: '#8B5CF6'
    - id: topic
      title: 专栏
      icon: solar:documents-bold-duotone
      url: /topic/
      accent: '#06B6D4'
  # v1 footer.social.theme 的明暗切换按钮。v2 改为内置功能：
  # 开启后由主题注入 window.setColorScheme(mode)，这里用 Leftbar 底部按钮调用。
  footer:
    actions:
      - type: button
        icon: default:theme
        title: 切换明暗主题
        onclick: "setColorScheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')"

rightbar:
  enabled: true

footer:
  # v1 footer.sitemap 的映射形式改为分栏数组。
  sitemap:
    - title: 站内
      items:
        - '[首页](/)'
        - '[归档](/archives/)'
        - '[标签](/tags/)'
        - '[番剧](/bangumis/)'
    - title: 站外
      items:
        - '[Home](https://home.syouiti.com)'
        - '[GitHub](https://github.com/sy0u1ti)'
  content: |
    记录 AI、效率工具、网络技术与各种折腾。
    本站由 [{author.name}](/) 创建 · [萌ICP备20244469号](https://icp.gov.moe/?keyword=20244469)

######## Profile ########

# v1 site_tree 迁移为 profiles；Widget 列表由逗号字符串改为数组。
profiles:
  home:
    active_menu: post
    leftbar:
      widgets:
        - profile
        - recent_posts
        - topic_tags
    rightbar:
      widgets: []
  blog_index:
    active_menu: post
    leftbar:
      widgets:
        - profile
        - recent_posts
        - topic_tags
    rightbar:
      widgets: []
  post:
    active_menu: post
    leftbar:
      widgets:
        - related
        - recent_posts
        - topic_tags
    rightbar:
      widgets:
        - toc
  topic:
    active_menu: post
  author:
    active_menu: post
    leftbar:
      widgets:
        - profile
        - recent_posts
    rightbar:
      widgets: []
  error:
    active_menu: post
    leftbar:
      widgets:
        - profile
        - recent_posts
    rightbar:
      widgets: []
  page:
    active_menu: post
    leftbar:
      widgets:
        - profile
        - recent_posts
    rightbar:
      widgets:
        - toc

######## 内容 ########

article:
  # v1 article.type: tech
  style: tech
  listing:
    # v1 article.pin_style: carousel
    pinned_layout: carousel
    # v1 article.card_style: default
    card_layout: classic
    # v1 article.cover_ratio: 2.4
    cover_ratio: 2.4
    # v1 article.auto_excerpt: 20
    excerpt_length: 20
    # v1 article.card_tags: 4
    show_tags: true
  # v1 article.category_color
  category_colors:
    探索号: '#f44336'
  # v1 article.related_posts（enable: false）
  related_posts_limit: 0
  footer:
    license: '本文采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
    # v1 article.share: [wechat, weibo, email, link]
    # v2 服务集合为 qrcode/weibo/x/telegram/whatsapp/email，wechat→qrcode，link 移除。
    share:
      - qrcode
      - weibo
      - email
    show_tags: true

######## 外观 ########

appearance:
  # 外观预设；可选 card / glass / minimal / flat。
  # glass 会启用玻璃材质交互，并消费下方 backgrounds.leftbar 的背景图设置。
  preset: glass
  # v1 style.prefers_theme: auto
  color_scheme: auto
  colors:
    # v1 style.color.theme/accent/link
    primary: 'hsl(25 95% 53%)'
    accent: 'hsl(38 96% 54%)'
    link: 'hsl(25 95% 53%)'
  gradients:
    # v1 style.gradient.start
    primary_action: 'linear-gradient(to right, hsl(215, 95%, 64%), hsl(195, 95%, 60%), hsl(165, 95%, 56%), hsl(165, 95%, 56%), hsl(195 95% 60%), hsl(215, 95%, 64%))'
  typography:
    font_family:
      body: 'system-ui, "Microsoft Yahei", "Segoe UI", -apple-system, Roboto, Ubuntu, "Helvetica Neue", Arial, "WenQuanYi Micro Hei", sans-serif'
      code: 'Menlo, Monaco, Consolas, system-ui, "Courier New", monospace, sans-serif'
    font_size:
      root: 16px
      inline_code: 85%
      code_block: 0.8125rem
    content_align: left
  shape:
    radius:
      # v1 style.border-radius.card-l/card/bar/image
      card_large: 18px
      card: 14px
      bar: 10px
      image_large: 18px
      image: 14px
      image_small: 10px
  backgrounds:
    # v1 style.leftbar（glass 外观 + 背景图）
    leftbar:
      type: image
      image: https://res.xaox.cc/gh/cdn-x/placeholder@1.0.13/image/sidebar-bg1@small.jpg
      opacity: 0.8
      backdrop:
        radius: 100px
    page:
      backdrop:
        radius: 100px
        overlay: var(--bg-a75)
  code_block:
    scrollbar_width: 4px
    highlight_stylesheet: https://gcore.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css

######## 功能 ########

search:
  # v1 search.service: local_search
  provider: local
  local:
    # v1 search.local_search.field: post
    scope: post
    # v1 search.local_search.content: true
    include_content: true

comments:
  # v1 comments.service
  provider: giscus
  # v1 comments.comment_title
  title: 快来参与讨论吧~
  giscus:
    # v1 comments.giscus.src
    js: https://giscus.app/client.js
    data-repo: sy0u1ti/sy0u1ti.github.io
    data-repo-id: R_kgDOKbZc8Q
    data-category: General
    data-category-id: DIC_kwDOKbZc8c4CZ0-1
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: bottom
    data-theme: noborder_dark
    data-lang: zh-CN
    data-loading: lazy
    crossorigin: anonymous

tags:
  # v1 tag_plugins.note
  note:
    default_color: ''
    border: true
  # v1 tag_plugins.checkbox
  checkbox:
    interactive: false
  # v1 tag_plugins.quot（改用 v2 内置图标键）
  quot:
    default:
      prefix: 'quot:quote-left'
      suffix: 'quot:quote-right'
    hashtag:
      prefix: 'quot:hashtag'
      suffix: null
    question:
      prefix: 'quot:question'
      suffix: null
  # v1 tag_plugins.emoji（v2 拆为 default_source + sources）
  emoji:
    default_source: qq
    sources:
      twemoji: https://gcore.jsdelivr.net/gh/twitter/twemoji/assets/svg/{name}.svg
      qq: https://gcore.jsdelivr.net/gh/cdn-x/emoji/qq/{name}.gif
      aru: https://gcore.jsdelivr.net/gh/cdn-x/emoji/aru-l/{name}.gif
      tieba: https://gcore.jsdelivr.net/gh/cdn-x/emoji/tieba/{name}.png
      blobcat: https://gcore.jsdelivr.net/gh/norevi/waline-blobcatemojis@1.0/blobs/{name}.png
  icon:
    default_color: accent
  button:
    default_color: theme
  mark:
    default_color: yellow
  hashtag:
    default_color: null
  gallery:
    size: mix
    # v1 tag_plugins.gallery.ratio: square
    aspect_ratio: square

features:
  # v1 footer.social.theme 的明暗切换按钮；v2 改为内置功能开关，
  # 开启后注入 window.setColorScheme(mode)，配合上面的按钮使用。
  color_scheme_switch:
    enabled: true
  # v1 plugins.preload
  link_prefetch:
    enabled: true
  # v1 plugins.fancybox
  lightbox:
    enabled: true
    selector: '.md-text img:not(.inline):not([class*="avatar"]), .post-cover img, .cover img'
  # v1 plugins.scrollreveal
  reveal:
    enabled: true
    duration: 500
    interval: 60
    distance: 10
  # v1 plugins.card_hover
  card_hover:
    spotlight: true
    tilt: true

######## 服务与资源 ########

services:
  markdown:
    js: https://cdn.jsdelivr.net/npm/marked@13.0.1/lib/marked.umd.min.js
  github:
    # v1 api_host
    api_url: https://api.github.com
    raw_url: https://raw.githubusercontent.com
    gist_url: https://gist.github.com

# v1 preconnect
preconnect:
  - https://cdn.jsdelivr.net
  - https://gcore.jsdelivr.net

fallbacks:
  avatar: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
  link_card: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/link/8f277b4ee0ecd.svg
  cover: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/cover/76b86c0226ffd.svg

######## SEO ########

canonical:
  # v1 canonical.originalHost
  host: blog.syouiti.com
  # v1 canonical.officialHosts
  allowed_hosts:
    - localhost

open_graph:
  # v1 open_graph.enable
  enabled: true
  # v1 open_graph.twitter_id
  twitter_id: Syou1Ti

######## 高级注入 ########

inject:
  # v1 inject.head
  head_end: '<link rel="stylesheet" href="/css/stellar-overrides.css?v=20260912-client-catalog">'
  # v1 inject.script
  body_end: '<script defer src="/js/plugins/reading-progress.js?v=20260823j"></script>'
